<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo List</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Todo List</h1>
      <div class="task">
        <label for="input">Enter your task</label>
        <input placeholder="Enter your task" type="text" id="input" aria-describedby="input-hint" />
        <button class="addButton">Add Task</button>
      </div>
      <ul id="list"></ul>
      <p id="empty-message" class="empty-message" style="display: none;">No tasks yet. Add one!</p>
    </div>
    <script src="app.js"></script>
  </body>
</html>
